<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2</title>
</head>
<body>
<canvas id="c"></canvas>
  <script  type="importmap">{
	"imports": {
		"three": "https://threejs.org/build/three.module.js",
		"three/addons/": "https://threejs.org/examples/jsm/"
	}
}</script>

    <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    
    function main() {
    
        const canvas = document.querySelector( '#c' );
        const renderer = new THREE.WebGLRenderer( { antialias: true, canvas } );
    
        const fov = 40;
        const aspect = 2; // the canvas default
        const near = 0.1;
        const far = 1000;
        const camera = new THREE.PerspectiveCamera( fov, aspect, near, far );
        camera.position.z = 120;
    
        const scene = new THREE.Scene();
        scene.background = new THREE.Color( 0xAAAAAA );
    
        {
    
            const color = 0xFFFFFF;
            const intensity = 3;
            const light = new THREE.DirectionalLight( color, intensity );
            light.position.set( - 1, 2, 4 );
            scene.add( light );
    
        }
    
        {
    
            const color = 0xFFFFFF;
            const intensity = 3;
            const light = new THREE.DirectionalLight( color, intensity );
            light.position.set( 1, - 2, - 4 );
            scene.add( light );
    
        }
    
        const objects = [];
        const spread = 15;
    
        function addObject( x, y, obj ) {
    
            obj.position.x = x * spread;
            obj.position.y = y * spread;
    
            scene.add( obj );
            objects.push( obj );
    
        }
    
        function createMaterial() {
    
            const material = new THREE.MeshPhongMaterial( {
                side: THREE.DoubleSide,
            } );
    
            const hue = Math.random();
            const saturation = 1;
            const luminance = .5;
            material.color.setHSL( hue, saturation, luminance );
    
            return material;
    
        }
    
        function addSolidGeometry( x, y, geometry ) {
    
            const mesh = new THREE.Mesh( geometry, createMaterial() );
            addObject( x, y, mesh );
    
        }
    
        function addLineGeometry( x, y, geometry ) {
    
            const material = new THREE.LineBasicMaterial( { color: 0x000000 } );
            const mesh = new THREE.LineSegments( geometry, material );
            addObject( x, y, mesh );
    
        }
    
    
        {
    
            const radius = 10;
            addSolidGeometry( - 2, - 1, new THREE.TetrahedronGeometry( radius ) );
    
        }
    
        {
    
            const loader = new FontLoader();
            // promisify font loading
            function loadFont( url ) {
    
                return new Promise( ( resolve, reject ) => {
    
                    loader.load( url, resolve, undefined, reject );
    
                } );
    
            }
    
            async function doit() {
    
                const font = await loadFont( 'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json' ); 
                const geometry = new TextGeometry( 'Aceito 10', {
                    font: font,
                    size: 5.0,
                    depth: .2,
                    curveSegments: 12,
                    bevelEnabled: true,
                    bevelThickness: 0.15,
                    bevelSize: .3,
                    bevelSegments: 5,
                } );
                const mesh = new THREE.Mesh( geometry, createMaterial() );
                geometry.computeBoundingBox();
                geometry.boundingBox.getCenter( mesh.position ).multiplyScalar( - 1 );
    
                const parent = new THREE.Object3D();
                parent.add( mesh );
    
                addObject( 0, 2, parent );
    
            }
    
            doit();
    
        }
    
        {
    
            const radius = 5;
            const tubeRadius = 2;
            const radialSegments = 8;
            const tubularSegments = 24;
            addSolidGeometry( 0, - 1, new THREE.TorusGeometry( radius, tubeRadius, radialSegments, tubularSegments ) );
    
        }
    
        {
    
            const radius = 3.5;
            const tube = 1.5;
            const radialSegments = 8;
            const tubularSegments = 64;
            const p = 2;
            const q = 3;
            addSolidGeometry( 1, - 1, new THREE.TorusKnotGeometry( radius, tube, tubularSegments, radialSegments, p, q ) );
    
        }
    
        {
    
            class CustomSinCurve extends THREE.Curve {
    
                constructor( scale ) {
    
                    super();
                    this.scale = scale;
    
                }
                getPoint( t ) {
    
                    const tx = t * 3 - 1.5;
                    const ty = Math.sin( 2 * Math.PI * t );
                    const tz = 0;
                    return new THREE.Vector3( tx, ty, tz ).multiplyScalar( this.scale );
    
                }
    
            }
    
            const path = new CustomSinCurve( 4 );
            const tubularSegments = 20;
            const radius = 1;
            const radialSegments = 8;
            const closed = false;
            addSolidGeometry( 2, - 1, new THREE.TubeGeometry( path, tubularSegments, radius, radialSegments, closed ) );
    
        }
    
    
    
        function resizeRendererToDisplaySize( renderer ) {
    
            const canvas = renderer.domElement;
            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const needResize = canvas.width !== width || canvas.height !== height;
            if ( needResize ) {
    
                renderer.setSize( width, height, false );
    
            }
    
            return needResize;
    
        }
    
        function render( time ) {
    
            time *= 0.001;
    
            if ( resizeRendererToDisplaySize( renderer ) ) {
    
                const canvas = renderer.domElement;
                camera.aspect = canvas.clientWidth / canvas.clientHeight;
                camera.updateProjectionMatrix();
    
            }
    
            objects.forEach( ( obj, ndx ) => {
    
                const speed = .1 + ndx * .05;
                const rot = time * speed;
                obj.rotation.x = rot;
                obj.rotation.y = rot;
    
            } );
    
            renderer.render( scene, camera );
    
            requestAnimationFrame( render );
    
        }
    
        requestAnimationFrame( render );
    
    }
    
    main();
    </script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            }
        #c {
            width: 100%;
            height: 100%;
            display: block;
    }

    </style>
</body>
</html>
